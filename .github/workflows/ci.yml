name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: Audit dependencies
              if: matrix.php-version == '8.2'
              run: composer audit --locked --no-interaction

            - name: php-cs-fixer
              run: php vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: phpstan
              run: php vendor/bin/phpstan analyze

            - name: Verify release archive
              if: matrix.php-version == '8.2'
              run: |
                  set -euo pipefail
                  archive_dir="$(mktemp -d)"
                  composer archive --format=tar --dir="$archive_dir" --file=phpbench-perfidious
                  tar -tf "$archive_dir/phpbench-perfidious.tar" > "$archive_dir/contents.txt"

                  grep -Fxq "composer.json" "$archive_dir/contents.txt"
                  grep -Fxq "LICENSE.md" "$archive_dir/contents.txt"
                  grep -Fxq "src/PerfidiousExecutor.php" "$archive_dir/contents.txt"

                  forbidden='^(\.claude|\.direnv|\.github|\.idea|\.phpbench|coverage|nix|stubs|tests|tmp|vendor)(/|$)|^(\.editorconfig|\.envrc|\.gitattributes|\.gitignore|\.php-cs-fixer\.cache|\.php-cs-fixer\.dist\.php|\.phpunit\.result\.cache|\.pre-commit-config\.yaml|clover\.xml|composer\.lock|flake\.lock|flake\.nix|infection\.json5|phpbench\.json|phpstan\.neon\.dist|phpunit\.xml\.dist|psalm\.xml)$|(^|/)[^/]*\.log$|^result'
                  if grep -E "$forbidden" "$archive_dir/contents.txt"; then
                      echo "Release archive contains excluded files"
                      exit 1
                  fi

    test:
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  extensions: perfidious-jbboehr/php-perfidious@v0.2.0
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2
              env:
                  PERFIDIOUS_LINUX_LIBS: libcap-dev libpfm4-dev

            - name: Verify perfidious extension
              run: php --ri perfidious

            - name: Allow unprivileged performance counters
              run: sudo sysctl -w kernel.perf_event_paranoid=1

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run test suite
              run: php vendor/bin/phpunit --no-coverage

# oh yeah, I forgot it doesn't work in Github Actions ... FML
#            - name: Run benchmarks
#              run: php vendor/bin/phpbench run

    dependencies:
        runs-on: ubuntu-latest
        name: "Dependencies | ${{ matrix.dependency-version }}"
        strategy:
            fail-fast: false
            matrix:
                dependency-version:
                    - lowest
                    - latest
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  extensions: perfidious-jbboehr/php-perfidious@v0.2.0
                  php-version: "8.2"
                  tools: composer:v2
              env:
                  PERFIDIOUS_LINUX_LIBS: libcap-dev libpfm4-dev

            - name: Verify perfidious extension
              run: php --ri perfidious

            - name: Allow unprivileged performance counters
              run: sudo sysctl -w kernel.perf_event_paranoid=1

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.2-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-${{ matrix.dependency-version }}-

            - name: Install lowest supported dependencies
              if: matrix.dependency-version == 'lowest'
              run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

            - name: Install latest supported dependencies
              if: matrix.dependency-version == 'latest'
              run: composer update --no-interaction --prefer-dist --no-progress

            - name: Show resolved PHPBench version
              run: composer show phpbench/phpbench

            - name: Run test suite
              run: php vendor/bin/phpunit --no-coverage

    coverage:
        runs-on: ubuntu-latest
        name: "Coverage | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.3"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: perfidious-jbboehr/php-perfidious@v0.2.0
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2
              env:
                  PERFIDIOUS_LINUX_LIBS: libcap-dev libpfm4-dev

            - name: Verify perfidious extension
              run: php --ri perfidious

            - name: Allow unprivileged performance counters
              run: sudo sysctl -w kernel.perf_event_paranoid=1

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run test suite with coverage
              run: php vendor/bin/phpunit --coverage-text

#            - name: Upload code coverage
#              # https://github.com/paambaati/codeclimate-action/issues/638#issuecomment-1363476627
#              uses: paambaati/codeclimate-action@v3.2.0
#              env:
#                  CC_TEST_REPORTER_ID: 3f8f6d064fc0b063230c71511f07aec326a2eb84f3c5653161b5f087aae315f9
#              with:
#                  coverageCommand: "true"
#                  coverageLocations: |
#                      clover.xml:clover

    mutation:
        runs-on: ubuntu-latest
        name: "Mutation Testing | PHP ${{ matrix.php-version }}"
        strategy:
            matrix:
                php-version:
                    - "8.3"
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: perfidious-jbboehr/php-perfidious@v0.2.0
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2
              env:
                  PERFIDIOUS_LINUX_LIBS: libcap-dev libpfm4-dev

            - name: Verify perfidious extension
              run: php --ri perfidious

            - name: Allow unprivileged performance counters
              run: sudo sysctl -w kernel.perf_event_paranoid=1

            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run mutation testing
              run: php vendor/bin/infection --threads=max --min-msi=70 --no-progress
